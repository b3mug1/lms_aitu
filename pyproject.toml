[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moodle-tg-notifier"
version = "0.1.0"
description = "Personal Moodle LMS parser and Telegram notification bot (grades, new assignments, deadline reminders)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13.0",
    "aiosqlite>=0.20.0",
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.117.1",
    "httpx>=0.27.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
sso = [
    "playwright>=1.49.0",
]

[project.scripts]
moodle-notifier = "app.main:run"
moodle-notifier-sso-login = "app.moodle_sso_login:run"

[tool.vercel]
entrypoint = "app.vercel_api:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
