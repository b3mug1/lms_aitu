<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e2e8f0;
    }
    .header h2 {
      margin: 0;
      font-size: 16px;
      color: #0f172a;
    }
    .status-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .status-connected {
      background: #dcfce7;
      color: #15803d;
    }
    .status-disconnected {
      background: #fee2e2;
      color: #b91c1c;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 10px;
      text-align: center;
      letter-spacing: 2px;
      font-weight: 600;
    }
    button {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
      margin-top: 6px;
    }
    .btn-secondary:hover {
      background: #cbd5e1;
    }
    .result-msg {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      display: none;
    }
    .footer {
      margin-top: 14px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">🎓</span>
    <h2>AITU Moodle Connect</h2>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span style="color: #64748b;">Статус:</span>
      <span id="status-badge" class="status-badge status-disconnected">Не подключён</span>
    </div>
    <div id="user-info-row" class="status-row" style="display: none; margin-top: 6px;">
      <span style="color: #64748b;">Студент:</span>
      <span id="user-fullname" style="font-weight: 600;">—</span>
    </div>
  </div>

  <div id="connect-block">
    <div style="font-size: 12px; color: #475569; margin-bottom: 8px;">
      Откройте /connect в Telegram и нажмите «Открыть Moodle». Если ссылка не открылась, вставьте её токен:
    </div>
    <input type="text" id="token-input" placeholder="Токен из ссылки" maxlength="256">
    <button id="btn-connect">Подключить к Telegram</button>
  </div>

  <div id="connected-block" style="display: none;">
    <button id="btn-sync">🔄 Обновить сессию сейчас</button>
  </div>

  <div id="result-msg" class="result-msg"></div>

  <div class="footer">
    AITU Moodle LMS Auto-Sync
  </div>

  <script src="popup.js"></script>
</body>
</html>
